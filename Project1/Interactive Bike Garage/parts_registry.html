<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Bike Garage">


    <meta property="og:title" content="Interactive Bike Garage">
    <meta property="og:description" content="Interactive Bike Garage">


    <meta name="author" content="Emile Bedard">
    <meta name="copyright" content="copyright Emile Bedard, project 1 CART 263, 2025">

    <title>Interactive Bike Garage</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">



    <link rel="stylesheet" href="styling/IBG_styles.css">
    <link rel="stylesheet" href="styling/IBG_styles_parts_registry.css">

    <!-- Space mono font from google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <script src="js/bike.js" defer></script>
    <script src="js/createBikes.js" defer></script>
    <script src="js/registerBikeParts.js" defer></script>

</head>

<body>
    <!-- top banner for title and menu button-->
    <nav>
        <div class="banner">
            <a href="index.html">
                <h3>Interactive Bike Garage</h3>
            </a>
        </div>
    </nav>

    <!-- main zone for all bicycles buttons and the ADD BIKE button-->
    <div class="bikes-menu">

        <h2 class="bikes-menu-instructions">Add a new bike or select one to register parts</h2>

        <div class="addBikeButton">
            <button>
                <p>ADD BIKE</p>
                <img src="assets/small bike element.png" alt="bicycle line art illustration">
            </button>
        </div>

        <!-- bike details window that pop's up when user decides to click on add bike -->
        <div class="bikeDetailsWindow">
            <h3>Enter bike details</h3>
            <form id="bikeForm">
                <label for="bikeName">Bike Name:</label>
                <input type="text" id="nameInput" placeholder="Your bike name.." required>

                <label for="bikeType">Bike Type:</label>
                <input type="text" id="typeInput" placeholder="Road, Gravel, mtb... " required>

                <label for="bikeColor">Bike Color:</label>
                <input type="color" id="colorInput" required>

                <input type="submit" id="submitInput" id="applyBikeButton" value="Submit">
            </form>
        </div>

    </div>
    <div class="partsZone">

        <div class="infographic-zone">
            <h3 id="infographic-name">ANATOMY OF ...</h3>
            <img src="assets/anatomy-of-a-bike-infographic.png" alt="bike parts infographic" class="infographic">
            <img src="assets/empty-frame.svg" alt="bike frame" class="empty-frame">
        </div>

        <div class="toolbox">
            <h3 class="toolbox-title">TOOLBOX</h3>
            <h3 class="bike-name-placeholder">NAME PLACEHOLDER</h3>
            <form>
                <label for="bikeName">Bike Name:</label>
                <input type="text" id="nameInput" placeholder="Your bike name..">

                <label for="bikeType">Bike Type:</label>
                <input type="text" id="typeInput" placeholder="Road, Gravel, mtb... ">

                <label for="bikeHandlebars">Handlebars:</label>
                <input type="text" id="handlebarsInput" placeholder="dropbars, flatbars ...">

                <label for="bikeFrame">Frame:</label>
                <input type="text" id="frameInput" placeholder="frame brand ? carbon? steel? aluminium or titanium?">

                <label for="bikeSize">Size:</label>
                <input type="text" id="sizeInput" placeholder="length of the seat tube, measured in cm.">

                <label for="bikeWheels">Wheels:</label>
                <input type="text" id="wheelsInput" placeholder="700c? 24/28/32mm ?">

                <label for="bikeTires">Tires:</label>
                <input type="text" id="tiresInput" placeholder="tire brand?">

                <label for="bikeRearDerailleur">Rear Derailleur:</label>
                <input type="text" id="rearDerailleurInput" placeholder="Shimano ? Sram ? electronic or mechanical?">

                <label for="bikeFrontDerailleur">Front Derailleur:</label>
                <input type="text" id="frontDerailleurInput" placeholder="Shimano ? Sram ? electronic or mechanical?">

                <label for="bikeCassette">Cassette:</label>
                <input type="text" id="cassetteInput" placeholder="number of speeds with tooths. ex: 34t/54t">

                <label for="bikePlateau">Plateau:</label>
                <input type="text" id="plateauInput" placeholder="brand and number of tooths for gear ratio">

                <label for="bikeCranks">Cranks:</label>
                <input type="text" id="cranksInput" placeholder="brand ? cranklength in mm ?">

                <label for="bikePedals">Pedals:</label>
                <input type="text" id="pedalsInput" placeholder="flats? clipless? powermeter">

                <input type="submit" id="submitInput" id="applyBikeButton" value="Submit">
            </form>
        </div>

    </div>
</body>

</html>
