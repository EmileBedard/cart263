<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Bike Garage">


    <meta property="og:title" content="Interactive Bike Garage">
    <meta property="og:description" content="Interactive Bike Garage">


    <meta name="author" content="Emile Bedard">
    <meta name="copyright" content="copyright Emile Bedard, project 1 CART 263, 2025">

    <title>Interactive Bike Garage</title>


    <link rel="stylesheet" href="styling/IBG_styles.css">
    <link rel="stylesheet" href="styling/IBG_styles_parts_registry.css">

    <!-- Space mono font from google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <script src="js/bike.js" defer></script>
    <script src="js/Interactive_Bike_Garage.js" defer></script>
</head>

<body>
    <!-- top banner for title and menu button-->
    <nav>
        <div class="banner">
            <a href="index.html">
                <h3>Interactive Bike Garage</h3>
            </a>
        </div>
    </nav>

    <!-- main zone for all bicycles buttons and the ADD BIKE button-->
    <div class="bikes-menu">
        <div class="addBikeButton">
            <button>
                <p>ADD BIKE</p>
                <img src="assets/small bike element.png" alt="bicycle line art illustration">
            </button>
        </div>

        <!-- bike details window that pop's up when user decides to click on add bike -->
        <div class="bikeDetailsWindow">
            <h3>Enter bike details</h3>
            <form id="bikeForm">
                <label for="bikeName">Bike Name:</label>
                <input type="text" id="nameInput" placeholder="Your bike name.." required>

                <label for="bikeType">Bike Type:</label>
                <input type="text" id="typeInput" placeholder="Road, Gravel, mtb... " required>

                <label for="bikeColor">Bike Color:</label>
                <input type="color" id="colorInput" required>

                <input type="submit" id="submitInput" id="applyBikeButton" value="Submit">
            </form>
        </div>

    </div>
</body>

</html>
